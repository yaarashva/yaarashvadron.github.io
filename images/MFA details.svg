<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="520" fill="#F6F4EF"/>

  <!-- Header -->
  <text x="400" y="44" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#B0ACA4" letter-spacing="3">MINISTRY OF FOREIGN AFFAIRS · JERUSALEM · 2014</text>

  <!-- BEFORE -->
  <text x="150" y="84" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#7A7060" letter-spacing="2">BEFORE</text>

  <rect x="50" y="96" width="200" height="40" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <rect x="64" y="109" width="100" height="7" rx="2" fill="#F5E040" opacity=".75"/>
  <rect x="64" y="121" width="70" height="7" rx="2" fill="#F5A0C0" opacity=".75"/>

  <rect x="50" y="144" width="200" height="40" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <rect x="64" y="157" width="115" height="7" rx="2" fill="#A8E6A0" opacity=".75"/>
  <rect x="64" y="169" width="60" height="7" rx="2" fill="#F5E040" opacity=".75"/>

  <rect x="50" y="192" width="200" height="40" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <rect x="64" y="205" width="80" height="7" rx="2" fill="#F5A0C0" opacity=".75"/>
  <rect x="64" y="217" width="100" height="7" rx="2" fill="#A8E6A0" opacity=".75"/>

  <rect x="50" y="240" width="200" height="40" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1.5" stroke-dasharray="4,3" opacity=".6"/>
  <text x="150" y="264" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#C0BCB4">hundreds more</text>

  <text x="150" y="308" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#B0ACA4">read · tag · route</text>
  <text x="150" y="322" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#B0ACA4">entirely manual</text>

  <!-- Arrow -->
  <line x1="260" y1="216" x2="318" y2="216" stroke="#E0DAD0" stroke-width="1.5"/>
  <polygon points="316,211 324,216 316,221" fill="#E0DAD0"/>

  <!-- CENTER logic -->
  <text x="420" y="84" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#1AA39A" letter-spacing="2">AUTOMATED LOGIC</text>
  <rect x="328" y="96" width="184" height="220" rx="6" fill="#1AA39A" opacity=".07" stroke="#1AA39A" stroke-width="1.2"/>

  <text x="420" y="130" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">01 · classify</text>
  <text x="420" y="146" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">topic · urgency · source agency</text>
  <line x1="350" y1="160" x2="490" y2="160" stroke="#E0DAD0" stroke-width=".8"/>

  <text x="420" y="182" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">02 · route</text>
  <text x="420" y="198" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">match rules → department</text>
  <line x1="350" y1="212" x2="490" y2="212" stroke="#E0DAD0" stroke-width=".8"/>

  <text x="420" y="234" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">03 · flag</text>
  <text x="420" y="250" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">sensitivity threshold → human</text>
  <line x1="350" y1="264" x2="490" y2="264" stroke="#E0DAD0" stroke-width=".8"/>

  <text x="420" y="296" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">built in Excel · designed with IT</text>

  <!-- Arrow out -->
  <line x1="512" y1="216" x2="570" y2="216" stroke="#1AA39A" stroke-width="1.5" opacity=".5"/>
  <polygon points="568,211 576,216 568,221" fill="#1AA39A" opacity=".5"/>

  <!-- AFTER -->
  <text x="680" y="84" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#7A7060" letter-spacing="2">ROUTED</text>

  <rect x="582" y="96" width="196" height="34" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <text x="680" y="117" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">Department A · auto</text>
  <rect x="582" y="138" width="196" height="34" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <text x="680" y="159" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">Department B · auto</text>
  <rect x="582" y="180" width="196" height="34" rx="3" fill="#1AA39A" opacity=".1" stroke="#1AA39A" stroke-width="1"/>
  <text x="680" y="201" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#1AA39A">Flagged · human review</text>
  <rect x="582" y="222" width="196" height="34" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <text x="680" y="243" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">Department C · auto</text>
  <rect x="582" y="264" width="196" height="34" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <text x="680" y="285" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">Department D · auto</text>

  <!-- Impact bar -->
  <rect x="50" y="370" width="700" height="1" fill="#E0DAD0"/>
  <text x="400" y="406" text-anchor="middle" font-family="DM Mono,monospace" font-size="11" fill="#1AA39A">75% reduction in manual effort</text>
  <text x="400" y="426" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#7A7060">proposed as a student · built with IT · still in use today</text>
</svg>
