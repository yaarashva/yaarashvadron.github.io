<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="560" fill="#F6F4EF"/>

  <!-- Title -->
  <text x="400" y="44" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#B0ACA4" letter-spacing="3">CSM CAPACITY MODEL · FTE FORMULA</text>

  <!-- Formula headline -->
  <rect x="60" y="62" width="680" height="48" rx="4" fill="#1AA39A" opacity=".08" stroke="#1AA39A" stroke-width="1"/>
  <text x="400" y="82" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#1AA39A">FTE Required  =  Σ Account Hours  /  Available Hours per CSM</text>
  <text x="400" y="100" text-anchor="middle" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">per account:  customer-facing time  ×  tier weight  ×  seniority factor  ×  product count</text>

  <!-- Table header -->
  <rect x="60" y="128" width="680" height="30" rx="3" fill="#EEEAE2"/>
  <text x="160" y="147" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060" letter-spacing="1">VARIABLE</text>
  <text x="370" y="147" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060" letter-spacing="1">HOW IT'S MEASURED</text>
  <text x="620" y="147" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060" letter-spacing="1">EXAMPLE VALUE</text>

  <!-- Row dividers helper -->
  <!-- Row 1: Customer-facing time -->
  <rect x="60" y="158" width="680" height="46" rx="0" fill="#FFFFFF" stroke="#E0DAD0" stroke-width=".5"/>
  <text x="80" y="176" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">Customer-facing time</text>
  <text x="80" y="192" font-family="DM Mono,monospace" font-size="8" fill="#B0ACA4">meetings · prep · follow-ups</text>
  <text x="270" y="185" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">Avg hrs/month per account type</text>
  <text x="530" y="185" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">Strategic: 8 hrs · Mid: 4 hrs · Low: 1.5 hrs</text>

  <!-- Row 2: Account tier -->
  <rect x="60" y="204" width="680" height="46" rx="0" fill="#F9F8F5" stroke="#E0DAD0" stroke-width=".5"/>
  <text x="80" y="222" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">Account tier</text>
  <text x="80" y="238" font-family="DM Mono,monospace" font-size="8" fill="#B0ACA4">strategic · mid-market · low-touch</text>
  <text x="270" y="231" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">Salesforce account segment field</text>
  <text x="530" y="231" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">S: 1.6× · M: 1.0× · L: 0.4×</text>

  <!-- Row 3: CSM seniority -->
  <rect x="60" y="250" width="680" height="46" rx="0" fill="#FFFFFF" stroke="#E0DAD0" stroke-width=".5"/>
  <text x="80" y="268" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">CSM seniority</text>
  <text x="80" y="284" font-family="DM Mono,monospace" font-size="8" fill="#B0ACA4">junior · mid · senior</text>
  <text x="270" y="277" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">Role level in HR system</text>
  <text x="530" y="277" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">Junior: 0.85× · Senior: 1.15×</text>

  <!-- Row 4: Active products -->
  <rect x="60" y="296" width="680" height="46" rx="0" fill="#F9F8F5" stroke="#E0DAD0" stroke-width=".5"/>
  <text x="80" y="314" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">Active products</text>
  <text x="80" y="330" font-family="DM Mono,monospace" font-size="8" fill="#B0ACA4">modules in use per customer</text>
  <text x="270" y="323" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">Product count from Salesforce</text>
  <text x="530" y="323" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">+0.3 hrs per additional product</text>

  <!-- Row 5: Available hours -->
  <rect x="60" y="342" width="680" height="46" rx="0" fill="#FFFFFF" stroke="#E0DAD0" stroke-width=".5"/>
  <text x="80" y="360" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">Available hrs per CSM</text>
  <text x="80" y="376" font-family="DM Mono,monospace" font-size="8" fill="#B0ACA4">denominator for FTE calc</text>
  <text x="270" y="369" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">Standard hrs minus internal overhead</text>
  <text x="530" y="369" font-family="DM Mono,monospace" font-size="8.5" fill="#7A7060">~100 hrs/month customer-facing</text>

  <!-- Output row -->
  <rect x="60" y="404" width="680" height="46" rx="3" fill="#1AA39A" opacity=".1" stroke="#1AA39A" stroke-width="1"/>
  <text x="80" y="424" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">Output: FTE needed</text>
  <text x="80" y="440" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">updated every 2 months · manual input by CSM managers</text>
  <text x="530" y="432" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">→ hire / hold / reassign</text>

  <!-- Footer -->
  <rect x="60" y="468" width="680" height="1" fill="#E0DAD0"/>
  <text x="400" y="494" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#7A7060">Data source: Salesforce · Visualization: Tableau · Updated bimonthly</text>
  <text x="400" y="514" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">Drove hire-behind-the-curve strategy · 6 to 16 CSMs over 2 years</text>
</svg>
