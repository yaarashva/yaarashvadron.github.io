<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#F6F4EF"/>

  <!-- Section label -->
  <text x="400" y="44" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#B0ACA4" letter-spacing="3">MINISTRY OF FOREIGN AFFAIRS · 2014</text>

  <!-- BEFORE: incoming documents -->
  <text x="150" y="84" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#7A7060" letter-spacing="2">BEFORE</text>

  <rect x="60" y="96" width="175" height="38" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <rect x="72" y="108" width="90" height="6" rx="2" fill="#F5E040" opacity=".75"/>
  <rect x="72" y="119" width="65" height="6" rx="2" fill="#F5A0C0" opacity=".75"/>

  <rect x="60" y="142" width="175" height="38" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <rect x="72" y="154" width="100" height="6" rx="2" fill="#A8E6A0" opacity=".75"/>
  <rect x="72" y="165" width="55" height="6" rx="2" fill="#F5E040" opacity=".75"/>

  <rect x="60" y="188" width="175" height="38" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <rect x="72" y="200" width="75" height="6" rx="2" fill="#F5A0C0" opacity=".75"/>
  <rect x="72" y="211" width="90" height="6" rx="2" fill="#A8E6A0" opacity=".75"/>

  <text x="150" y="254" text-anchor="middle" font-family="DM Mono,monospace" font-size="16" fill="#C8C4BA">···</text>
  <text x="150" y="280" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#B0ACA4">manual · 100% effort</text>

  <!-- Arrow in -->
  <line x1="245" y1="190" x2="305" y2="190" stroke="#E0DAD0" stroke-width="1.5"/>
  <polygon points="303,185 311,190 303,195" fill="#E0DAD0"/>

  <!-- CENTER: tagging logic box -->
  <text x="400" y="84" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#1AA39A" letter-spacing="2">LOGIC</text>
  <rect x="314" y="96" width="172" height="188" rx="6" fill="#1AA39A" opacity=".07" stroke="#1AA39A" stroke-width="1.2"/>
  <text x="400" y="148" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">classify</text>
  <text x="400" y="163" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">topic · urgency · source</text>
  <line x1="340" y1="178" x2="460" y2="178" stroke="#E0DAD0" stroke-width=".8"/>
  <text x="400" y="198" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">route</text>
  <text x="400" y="213" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">auto → department</text>
  <line x1="340" y1="226" x2="460" y2="226" stroke="#E0DAD0" stroke-width=".8"/>
  <text x="400" y="246" text-anchor="middle" font-family="DM Mono,monospace" font-size="9" fill="#1AA39A">flag</text>
  <text x="400" y="261" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">sensitive → human</text>

  <!-- Arrow out -->
  <line x1="486" y1="190" x2="546" y2="190" stroke="#1AA39A" stroke-width="1.5" opacity=".5"/>
  <polygon points="544,185 552,190 544,195" fill="#1AA39A" opacity=".5"/>

  <!-- AFTER: departments -->
  <text x="650" y="84" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#7A7060" letter-spacing="2">ROUTED</text>

  <rect x="558" y="96" width="172" height="32" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <text x="644" y="116" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">Dept A · auto</text>

  <rect x="558" y="136" width="172" height="32" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <text x="644" y="156" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">Dept B · auto</text>

  <rect x="558" y="176" width="172" height="32" rx="3" fill="#1AA39A" opacity=".1" stroke="#1AA39A" stroke-width="1"/>
  <text x="644" y="196" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#1AA39A">Flagged · human review</text>

  <rect x="558" y="216" width="172" height="32" rx="3" fill="#FFFFFF" stroke="#E0DAD0" stroke-width="1"/>
  <text x="644" y="236" text-anchor="middle" font-family="DM Mono,monospace" font-size="8" fill="#7A7060">Dept C · auto</text>

  <!-- Bottom impact bar -->
  <rect x="60" y="320" width="680" height="1" fill="#E0DAD0"/>
  <text x="400" y="352" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#1AA39A">75% reduction in manual effort · still in use today</text>
</svg>
